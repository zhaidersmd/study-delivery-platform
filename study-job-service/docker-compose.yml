services:

  postgres:
    image: postgres:16
    container_name: study-job-postgres
    environment:
      POSTGRES_DB: study_delivery
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_password
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
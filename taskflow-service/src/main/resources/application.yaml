spring:
  application:
    name: taskflow-service
  kafka:
    bootstrap-servers:  localhost:9092
  datasource:
    url:  jdbc:postgresql://localhost:5440/taskflow_service
    username: study_user
    password: study_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect:  org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 7071
management:
  endpoints:
    web:
      exposure:
        include: health,info

